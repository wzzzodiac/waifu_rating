<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waifu Rating Machine 3000</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://avatars.githubusercontent.com/u/46037018?v=4" />

  <style>
    :root {
      --bg: #070a0d;
      --panel: #0d1217;
      --line: #27313a;
      --line-soft: rgba(122, 214, 255, 0.12);
      --text: #e8edf2;
      --muted: #9aa7b3;
      --cyan: #61d7ff;
      --amber: #ffb454;
      --pink: #ff7ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 36px);
      color: var(--text);
      font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(97,215,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(97,215,255,.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    body::before {
      content: "WAIFU ANALYSIS LAB // UNVERIFIED SCIENCE";
      position: fixed;
      left: 18px;
      top: 14px;
      color: rgba(97,215,255,.42);
      font-size: 11px;
      letter-spacing: .12em;
      pointer-events: none;
    }
    .card {
      width: min(640px, 100%);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: clamp(22px, 4vw, 34px);
      background: linear-gradient(180deg, #0e141a, #090d11);
      box-shadow: 10px 10px 0 rgba(0,0,0,.22);
    }
    .card::before { content: "SPECIMEN TERMINAL 03"; position: absolute; right: 12px; top: 9px; color: rgba(255,180,84,.48); font-size: 10px; letter-spacing: .12em; }
    .card::after { content: "RATING UNIT"; position: absolute; right: -8px; bottom: -5px; font-size: clamp(34px, 8vw, 48px); font-weight: 900; color: rgba(97,215,255,.025); pointer-events: none; }
    .badge { display: inline-block; margin-bottom: 19px; color: var(--pink); font-size: 12px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .badge::before { content: "[ "; color: var(--cyan); }
    .badge::after { content: " ]"; color: var(--cyan); }
    .badge span:first-child { display: none; }
    h1 { margin-bottom: 10px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: clamp(30px, 6vw, 42px); line-height: 1.05; letter-spacing: -.025em; }
    .sub { max-width: 540px; margin-bottom: 26px; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .upload-zone {
      min-height: 170px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      cursor: pointer;
      border: 1px dashed #3a4a56;
      border-radius: 2px;
      background:
        linear-gradient(rgba(97,215,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(97,215,255,.018) 1px, transparent 1px),
        #0a0f14;
      background-size: 16px 16px;
      transition: border-color .14s ease, background-color .14s ease;
    }
    .upload-zone:hover { border-color: var(--cyan); background-color: #0d141a; }
    .upload-icon { font-size: 0; width: 48px; height: 34px; position: relative; border: 1px solid var(--cyan); opacity: .8; }
    .upload-icon::before { content: "IMG"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--cyan); font-size: 12px; letter-spacing: .12em; }
    .upload-text-main { font-size: 14px; color: var(--text); }
    .upload-text-sub { font-size: 12px; color: #7a8792; }
    input[type="file"] { display: none; }
    .preview { margin-top: 20px; display: none; grid-template-columns: minmax(150px, 190px) 1fr; align-items: start; gap: 20px; }
    .preview-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 1px; border: 1px solid #47535f; background: #05080b; filter: saturate(.92) contrast(1.03); }
    .status { min-height: 20px; color: var(--cyan); font-size: 12px; line-height: 1.5; letter-spacing: .07em; text-transform: uppercase; }
    .status::before { content: "> "; color: var(--amber); }
    .result { margin-top: 14px; padding: 15px 16px; display: none; border: 1px solid var(--line); border-left: 3px solid var(--pink); background: #0a0f14; }
    .result-score { margin-bottom: 7px; color: var(--amber); font-size: 26px; font-weight: 800; }
    .result-text { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .footer { margin-top: 20px; padding-top: 13px; border-top: 1px solid var(--line-soft); color: #75818b; font-size: 11px; text-align: left; }
    .footer::before { content: "DISCLAIMER // "; color: var(--pink); }
    .glow-orb { display: none; }

    @media (max-width: 620px) {
      body { padding: 58px 14px 20px; place-items: start center; }
      body::before { left: 14px; font-size: 9px; }
      .card { width: 100%; padding: 22px 17px; box-shadow: 6px 6px 0 rgba(0,0,0,.2); }
      .card::before { font-size: 8px; }
      .preview { grid-template-columns: 1fr; }
      .preview-img { max-width: 320px; justify-self: center; }
      .upload-zone { min-height: 145px; }
    }

    @media (max-width: 380px) {
      h1 { font-size: 27px; }
      .sub { font-size: 14px; }
      .badge { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-orb"></div>
    <div class="badge"><span>💖</span><span>Waifu Rating Machine 3000</span></div>
    <h1>Upload your waifu.</h1>
    <p class="sub">Our totally accurate, definitely scientific AI will rate her immediately.</p>
    <label class="upload-zone" for="fileInput">
      <div class="upload-icon">📂</div>
      <div class="upload-text-main">Click here to choose a picture</div>
      <div class="upload-text-sub">No drag &amp; drop, we are lazy.</div>
    </label>
    <input id="fileInput" type="file" accept="image/*" />
    <div class="preview" id="preview">
      <img id="previewImg" class="preview-img" src="" alt="waifu preview" />
      <div>
        <div class="status" id="status"></div>
        <div class="result" id="result">
          <div class="result-score" id="resultScore"></div>
          <div class="result-text" id="resultText"></div>
        </div>
      </div>
    </div>
    <p class="footer">*Ratings are 100% random and 0% serious. Don't cry.</p>
  </div>

  <script>
    const fileInput   = document.getElementById('fileInput');
    const preview     = document.getElementById('preview');
    const previewImg  = document.getElementById('previewImg');
    const statusEl    = document.getElementById('status');
    const resultEl    = document.getElementById('result');
    const resultScore = document.getElementById('resultScore');
    const resultText  = document.getElementById('resultText');

    const messages = [
      "Peak waifu material, ngl.",
      "The council has spoken: certified top tier.",
      "Would easily solo 99% of other waifus.",
      "Scientists are still trying to understand this level of perfection.",
      "Bro, how did you even unlock this character?",
      "Maxed out stats in charm, plot and personality."
    ];

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        preview.style.display = 'grid';
      };
      reader.readAsDataURL(file);

      resultEl.style.display = 'none';
      statusEl.textContent = "Analyzing waifu aura…";
      
      setTimeout(() => {
        const score = Math.floor(70 + Math.random() * 30);
        const msg = messages[Math.floor(Math.random() * messages.length)];

        resultScore.textContent = score + "/100 ⭐";
        resultText.textContent = msg;
        resultEl.style.display = 'block';
        statusEl.textContent = "Analysis complete.";
      }, 1200);
    });
  </script>
</body>
</html>
