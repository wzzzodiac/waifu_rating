<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waifu Rating Machine 3000</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Favicon opcional: pon tu propio link si quieres -->
  <link rel="icon" href="https://avatars.githubusercontent.com/u/46037018?v=4" />

  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #020617;
      --accent: #f97316;
      --accent-soft: rgba(249,115,22,0.15);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --card: #020617dd;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #020617 55%);
      color: var(--text);
    }

    .card {
      width: min(480px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid rgba(148,163,184,0.4);
      padding: 24px 22px 22px;
      box-shadow: 0 18px 45px rgba(15,23,42,0.9);
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 10px;
    }

    .badge span {
      font-size: 13px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .upload-zone {
      border-radius: 16px;
      border: 1px dashed rgba(148,163,184,0.7);
      padding: 16px;
      background: rgba(15,23,42,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease,
        transform .1s ease;
    }

    .upload-zone:hover {
      border-color: var(--accent);
      background: rgba(15,23,42,0.95);
      transform: translateY(-1px);
    }

    .upload-icon {
      font-size: 26px;
    }

    .upload-text-main {
      font-size: 13px;
    }

    .upload-text-sub {
      font-size: 11px;
      color: var(--muted);
    }

    input[type="file"] {
      display: none;
    }

    .preview {
      margin-top: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .preview-img {
      width: 150px;
      height: 150px;
      border-radius: 24px;
      object-fit: cover;
      border: 2px solid rgba(148,163,184,0.7);
      background: #020617;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .result {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(249,115,22,0.4);
      display: none;
    }

    .result-score {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .result-text {
      font-size: 13px;
      color: var(--muted);
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      opacity: 0.75;
    }

    .glow-orb {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(249,115,22,0.55), transparent);
      top: -80px;
      right: -80px;
      opacity: 0.5;
      pointer-events: none;
      filter: blur(1px);
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px 16px 18px;
      }
      .preview-img {
        width: 130px;
        height: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-orb"></div>

    <div class="badge">
      <span>💖</span>
      <span>Waifu Rating Machine 3000</span>
    </div>

    <h1>Upload your waifu.</h1>
    <p class="sub">Our totally accurate, definitely scientific AI will rate her immediately.</p>

    <!-- Zona de upload -->
    <label class="upload-zone" for="fileInput">
      <div class="upload-icon">📂</div>
      <div class="upload-text-main">Click here to choose a picture</div>
      <div class="upload-text-sub">No drag &amp; drop, we are lazy.</div>
    </label>
    <input id="fileInput" type="file" accept="image/*" />

    <!-- Preview -->
    <div class="preview" id="preview">
      <img id="previewImg" class="preview-img" src="" alt="waifu preview" />
      <div class="status" id="status"></div>
      <div class="result" id="result">
        <div class="result-score" id="resultScore"></div>
        <div class="result-text" id="resultText"></div>
      </div>
    </div>

    <p class="footer">
      *Ratings are 100% random and 0% serious. Don't cry.
    </p>
  </div>

  <script>
    const fileInput   = document.getElementById('fileInput');
    const preview     = document.getElementById('preview');
    const previewImg  = document.getElementById('previewImg');
    const statusEl    = document.getElementById('status');
    const resultEl    = document.getElementById('result');
    const resultScore = document.getElementById('resultScore');
    const resultText  = document.getElementById('resultText');

    const messages = [
      "Peak waifu material, ngl.",
      "The council has spoken: certified top tier.",
      "Would easily solo 99% of other waifus.",
      "Scientists are still trying to understand this level of perfection.",
      "Bro, how did you even unlock this character?",
      "Maxed out stats in charm, plot and personality."
    ];

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      // Mostrar preview
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        preview.style.display = 'flex';
      };
      reader.readAsDataURL(file);

      // Reset estado
      resultEl.style.display = 'none';
      statusEl.textContent = "Analyzing waifu aura…";
      
      // Simular “procesamiento” y luego mostrar rating
      setTimeout(() => {
        const score = Math.floor(70 + Math.random() * 30); // 70-99
        const msg = messages[Math.floor(Math.random() * messages.length)];

        resultScore.textContent = score + "/100 ⭐";
        resultText.textContent = msg;
        resultEl.style.display = 'block';
        statusEl.textContent = "Analysis complete.";
      }, 1200);
    });
  </script>
</body>
</html>
